# Alembic configuration.
#
# No sqlalchemy.url here on purpose — migrations/env.py takes the URL from
# app.core.config's Settings (i.e. from .env / the container's env vars),
# so there is exactly one place the database connection is defined and no
# risk of migrations running against a different database than the app.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Timestamped, readable revision filenames instead of a bare hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
